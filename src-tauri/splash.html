<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>AR-pic</title>
<script>
  // Rust(setup 스레드)가 window.eval()로 호출한다. 페이지 파싱 전에 호출될 수 있으므로
  // 상태만 갱신해 두고 render()가 DOM 준비 여부를 보고 반영한다.
  var __state = { stage: "시작하는 중", pct: -1, error: null, hint: "" };

  function render() {
    var stageEl = document.getElementById("stage");
    if (!stageEl) return; // DOM 준비 전 — DOMContentLoaded에서 다시 호출된다
    var barEl = document.getElementById("bar");
    var trackEl = document.getElementById("track");
    var hintEl = document.getElementById("hint");
    var rootEl = document.getElementById("root");

    if (__state.error) {
      rootEl.classList.add("error");
      stageEl.textContent = __state.error;
      trackEl.style.display = "none";
      hintEl.textContent = __state.hint;
      return;
    }

    stageEl.textContent = __state.stage;
    trackEl.style.display = "block";
    if (__state.pct < 0) {
      trackEl.classList.add("indeterminate");
      barEl.style.width = "40%";
    } else {
      trackEl.classList.remove("indeterminate");
      barEl.style.width = __state.pct + "%";
    }
    hintEl.textContent = __state.hint || "최초 실행에는 몇 분이 걸릴 수 있습니다. 전원을 끄지 마세요.";
  }

  window.__arpic = {
    stage: function (text, pct) {
      __state.stage = text;
      __state.pct = typeof pct === "number" ? pct : -1;
      render();
    },
    progress: function (pct) {
      __state.pct = pct;
      render();
    },
    error: function (message, hint) {
      __state.error = message;
      __state.hint = hint || "";
      render();
    },
  };

  document.addEventListener("DOMContentLoaded", render);
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; color: #fff;
    font-family: "Malgun Gothic", "맑은 고딕", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  #root {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
  }
  #logo {
    font-size: 44px; font-weight: 700; letter-spacing: 6px;
    color: #fff;
  }
  #stage { font-size: 18px; color: #d4d4d4; min-height: 24px; text-align: center; }
  #track {
    width: 320px; height: 4px;
    background: #2a2a2a; border-radius: 2px; overflow: hidden;
    position: relative;
  }
  #bar {
    height: 100%; width: 0;
    background: #fff; border-radius: 2px;
    transition: width 0.25s ease;
  }
  /* 진행률을 알 수 없는 단계(서버 기동 등)에서는 막대가 좌우로 흐른다 —
     멈춘 것처럼 보이지 않게 하는 것이 이 화면의 존재 이유다. */
  #track.indeterminate #bar {
    transition: none;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  #hint { font-size: 13px; color: #6e6e6e; text-align: center; max-width: 520px; line-height: 1.6; }
  #root.error #stage { color: #ff8a8a; font-size: 17px; white-space: pre-line; }
  #root.error #logo { color: #555; }
</style>
</head>
<body>
  <div id="root">
    <div id="logo">AR-pic</div>
    <div id="stage">시작하는 중</div>
    <div id="track"><div id="bar"></div></div>
    <div id="hint"></div>
  </div>
</body>
</html>
