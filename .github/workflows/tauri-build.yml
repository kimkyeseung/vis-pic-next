name: Tauri Build (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create .env
        shell: bash
        run: |
          cat <<'EOF' > .env
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UPLOAD_DIR=static/images
          PAYAPP_USERID=${{ secrets.PAYAPP_USERID }}
          PAYAPP_GOODNAME=AR-pic 촬영
          PAYAPP_RECVPHONE=${{ secrets.PAYAPP_RECVPHONE }}
          PAYAPP_FEEDBACK_URL=${{ secrets.PAYAPP_FEEDBACK_URL }}
          PAYAPP_RETURN_URL=${{ secrets.PAYAPP_RETURN_URL }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Tauri
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AR-pic-Windows-installer-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: AR-pic-Windows-portable-${{ github.run_number }}
          path: src-tauri/target/release/AR-pic.exe
          if-no-files-found: error
